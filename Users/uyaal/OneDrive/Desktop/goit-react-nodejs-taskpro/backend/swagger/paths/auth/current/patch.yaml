operationId: updateCurrentUser
summary: Update current user
description: Updates the currently authenticated user's profile
tags:
  - Auth
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          avatar:
            type: string
            format: binary
            description: New avatar image
          name:
            type: string
            minLength: 2
            maxLength: 32
            example: John
          email:
            type: string
            format: email
            example: johndoe@example.com
          password:
            type: string
            format: password
            example: newPassword123
          theme:
            type: string
            enum:
              - light
              - dark
              - violet
            example: dark
responses:
  '200':
    description: User updated successfully
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/user.yaml'
  '400':
    description: Nothing to update or invalid data
  '401':
    $ref: '../../../components/responses/401.yaml'
  '409':
    $ref: '../../../components/responses/409.yaml'
