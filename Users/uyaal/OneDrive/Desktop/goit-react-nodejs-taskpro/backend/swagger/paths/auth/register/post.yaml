tags:
  - Auth
summary: Register a user
operationId: registerUser
description: 'Register a new user account'
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            type: string
            example: 'John Doe'
          email:
            type: string
            example: 'johndoe@example.com'
          password:
            type: string
            example: 'password123'
responses:
  '201':
    description: User registered successfully
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/authResponse.yaml

  '409':
    $ref: ../../../components/responses/409.yaml
