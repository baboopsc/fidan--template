type: object
properties:
  title:
    type: string
    maxLength: 100
    example: Updated task title
    description: Task title
  description:
    type: string
    example: Updated task description
  labelColor:
    type: string
    enum:
      - blue
      - pink
      - green
      - gray
    example: pink
  deadline:
    type: string
    format: date-time
    example: 2026-08-10T12:00:00.000Z
  columnId:
    type: string
    example: in-progress
