type: object
required:
  - title
  - description
  - deadline
properties:
  title:
    type: string
    maxLength: 100
    example: Finish project
  description:
    type: string
    example: Complete API documentation
  labelColor:
    type: string
    enum:
      - blue
      - pink
      - green
      - gray
    default: gray
    example: green
  deadline:
    type: string
    format: date-time
    example: 2026-08-01T12:00:00.000Z
  columnId:
    type: string
    example: todo
