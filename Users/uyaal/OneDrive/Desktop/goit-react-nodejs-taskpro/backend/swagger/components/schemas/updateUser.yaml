type: object
properties:
  name:
    description: User's name
    type: string
    minLength: 2
    maxLength: 32
    example: Jane Doe
  email:
    description: User email address
    type: string
    format: email
    example: jane@example.com
  password:
    description: New password
    type: string
    format: password
    minLength: 8
    maxLength: 64
    example: NewStrongPassword123
  theme:
    description: Preferred application theme
    type: string
    enum:
      - light
      - dark
      - violet
    example: dark
