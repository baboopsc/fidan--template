type: object
required:
  - name
  - email
  - password
properties:
  name:
    description: User's name
    type: string
    minLength: 2
    maxLength: 32
    example: John Doe
  email:
    description: User email address
    type: string
    format: email
    example: johndoe@example.com
  password:
    description: User password
    type: string
    format: password
    minLength: 8
    maxLength: 64
    example: StrongPassword123
