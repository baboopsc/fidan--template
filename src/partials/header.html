<!-- Üst menü: tüm sayfalara buradan eklenir.
     Sağdaki buton sayfadan gelir: cta = Türkçe yazı, ctakey = çeviri anahtarı, ctahref = bağlantı.
     Aktif sayfa js/ui.js, dil düğmeleri js/i18n.js tarafından işaretlenir. -->
<header class="site-header">
  <div class="wrap">
    <nav class="nav" aria-label="Ana menü" data-i18n-attr="aria-label:nav.aria">
      <a href="./index.html" class="brand" aria-label="Sağ Fidancılık ana sayfa" data-i18n-attr="aria-label:brand.aria"><img class="brand__logo" src="./img/logo.svg" alt="Sağ Fidancılık" width="740" height="438"></a>
      <ul class="nav-links">
        <li><a href="./index.html" data-page="index" data-i18n="nav.home">Ana Sayfa</a></li>
        <li><a href="./catalog.html" data-page="catalog" data-i18n="nav.catalog">Fidanlar</a></li>
        <li><a href="./index.html#hakkimizda" data-i18n="nav.about">Hakkımızda</a></li>
        <li><a href="./index.html#iletisim" data-i18n="nav.contact">İletişim</a></li>
      </ul>
      <div class="nav-actions">
        <div class="lang-switch" role="group" aria-label="Dil seçimi" data-i18n-attr="aria-label:lang.aria">
          <button class="lang-switch__btn" type="button" data-lang="tr" aria-pressed="true" aria-label="Türkçe" title="Türkçe"><img src="./img/flags/tr.svg" alt="" width="21" height="14"><span class="lang-switch__code">TR</span></button>
          <button class="lang-switch__btn" type="button" data-lang="en" aria-pressed="false" aria-label="English" title="English"><img src="./img/flags/gb.svg" alt="" width="21" height="14"><span class="lang-switch__code">EN</span></button>
          <button class="lang-switch__btn" type="button" data-lang="ru" aria-pressed="false" aria-label="Русский" title="Русский"><img src="./img/flags/ru.svg" alt="" width="21" height="14"><span class="lang-switch__code">RU</span></button>
          <button class="lang-switch__btn" type="button" data-lang="ar" aria-pressed="false" aria-label="العربية" title="العربية"><img src="./img/flags/ar.svg" alt="" width="21" height="14"><span class="lang-switch__code">AR</span></button>
        </div>
        <a href="{=$ctahref}" class="btn btn-primary btn-sm nav-cta" data-i18n="{=$ctakey}">{=$cta}</a>
        <button class="icon-btn nav-toggle" type="button" aria-label="Menüyü aç" data-i18n-attr="aria-label:nav.menu" aria-expanded="false"><i class="i i-menu"></i></button>
      </div>
    </nav>
  </div>
</header>
