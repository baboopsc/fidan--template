<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fidan Atlası | Sağ Fidancılık</title>
  <link rel="icon" href="./img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/atlas.css" />
</head>
<body>
  <header class="wrap shell nav">
    <a href="./index.html" class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-4px;margin-right:8px"><path d="M12 21v-8.5"/><path d="M12 12.5c0-4.4 3.1-7.6 8-7.6 0 4.4-3.1 7.6-8 7.6z"/><path d="M12 15c0-3.6-2.6-6.4-6.9-6.4 0 3.6 2.6 6.4 6.9 6.4z"/></svg>Sağ Fidancılık</a>
    <div class="tools">
      <label class="search"><span data-i="search"></span><input id="q" type="search" placeholder="Fidan ara" aria-label="Fidan ara" /></label>
      <button class="ibtn" data-i="heart" aria-label="Favoriler"></button>
      <button class="ibtn" data-i="user" aria-label="Hesabım"></button>
      <a class="ibtn" href="./library.html" data-i="cart" aria-label="Sepetim"></a>
    </div>
  </header>

  <nav class="wrap tabs" id="tabs" aria-label="Fidanlar"></nav>

  <main class="wrap shell main">
    <section>
      <div class="stage" id="stage">
        <div class="rail">
          <button class="rbtn" id="r3d" data-i="cube" data-tip="3D görünüme dön" aria-label="3D görünüme dön"></button>
          <button class="rbtn" id="rsize" data-i="ruler" data-tip="Boyut" aria-label="Boyut"></button>
          <button class="rbtn" id="rview" data-i="eye" data-tip="Tel kafes" aria-label="Tel kafes" aria-pressed="false"></button>
          <button class="rbtn" data-i="ar" data-tip="AR (yakında)" aria-label="AR yakında" disabled></button>
        </div>
        <div class="ring" id="ring"></div>
        <canvas id="gl"></canvas>
        <span class="size" id="size"></span>
      </div>
      <footer class="strip">
        <p id="quote"></p>
        <div class="dots" id="dots"></div>
      </footer>
    </section>

    <aside class="panel" id="panel">
      <div class="fade" id="fade">
        <span class="lbl" id="tax"></span>
        <h1 id="name"></h1>
        <p class="latin" id="latin"></p>
        <div class="tags" id="tags"></div>
        <p id="desc"></p>
        <div id="traits"></div>
        <div class="card"><h2>Yetiştiği yer</h2><p id="habitat"></p></div>
        <div class="card"><h2>Yakından bak</h2><p id="close"></p></div>
      </div>
    </aside>
  </main>
  <script type="module" src="./js/atlas.js"></script>
</body>
</html>
