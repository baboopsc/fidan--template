<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fidan Çeşitleri | Sağ Fidancılık</title>
  <meta name="description" content="Sertifikalı turunçgil, zeytin, nar ve meyve fidanı çeşitlerini inceleyin." />
  <meta name="theme-color" content="#fbf8f1" />
  <link rel="icon" href="./img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/icons.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/catalog.css" />
  <script>document.documentElement.classList.add('js')</script>
</head>
<body id="top">

  <load src="./partials/header.html" cta="Sepete Git" ctahref="./library.html" />

  <main>
    <!-- SAYFA BAŞLIĞI (arka plan fotoğraflı) -->
    <section class="page-hero">
      <div class="wrap">
        <nav class="crumbs" aria-label="Konum" data-reveal><a href="./index.html">Ana Sayfa</a><i class="i i-chevron-right"></i><span>Fidan Çeşitleri</span></nav>
        <h1 data-reveal style="--d:1">Fidan <em>Çeşitlerimiz</em></h1>
        <p data-reveal style="--d:2">Turunçgilden zeytine, nardan kayısıya sertifikalı fidanlarımızı inceleyin. Aradığınız çeşidi bulamazsanız bizi arayın.</p>
      </div>
    </section>

    <section class="wrap">
      <!-- ARAMA + KATEGORİ -->
      <div class="toolbar" data-reveal style="--d:3">
        <div class="search" id="search">
          <i class="i i-search"></i>
          <input id="q" type="search" placeholder="Hangi fidanı arıyorsunuz?" autocomplete="off" aria-label="Fidan ara">
          <button class="search__clear" id="clear" type="button" aria-label="Aramayı temizle"><i class="i i-close"></i></button>
        </div>
        <div class="chips" id="chips" aria-label="Kategoriler"></div>
      </div>

      <p class="result-count" id="count" aria-live="polite"></p>
      <div class="p-grid p-grid--3" id="grid"></div>

      <div class="empty" id="empty" hidden>
        <span class="empty__icon"><i class="i i-search"></i></span>
        <h3>Aradığınız fidanı bulamadık</h3>
        <p>Farklı bir kelime deneyin ya da filtreleri temizleyin.</p>
        <button class="btn btn-primary" id="reset" type="button">Filtreleri Temizle</button>
      </div>
    </section>
  </main>

  <!-- ÜRÜN PENCERESİ -->
  <dialog class="modal" id="modal" aria-labelledby="mTitle">
    <button class="icon-btn modal__close" type="button" data-close aria-label="Kapat"><i class="i i-close"></i></button>
    <div class="modal__inner">
      <div class="modal__media"><img id="mImg" src="" alt=""></div>
      <div class="modal__body">
        <span class="eyebrow" id="mCat"></span>
        <h2 id="mTitle"></h2>
        <p class="modal__variety" id="mVariety"></p>
        <p class="modal__desc" id="mDesc"></p>
        <div class="facts" id="mFacts"></div>
        <div class="modal__buy">
          <div class="qty">
            <button type="button" id="mMinus" aria-label="Azalt"><i class="i i-minus"></i></button>
            <output id="mQty">1</output>
            <button type="button" id="mPlus" aria-label="Artır"><i class="i i-plus"></i></button>
          </div>
          <strong class="modal__price" id="mPrice"></strong>
        </div>
        <button class="btn btn-primary btn-block" type="button" id="mAdd" data-add="" data-qty="1"><i class="i i-bag"></i> Sepete Ekle</button>
      </div>
    </div>
  </dialog>

  <load src="./partials/footer.html" />

  <script type="module" src="./js/catalog.js"></script>
</body>
</html>
